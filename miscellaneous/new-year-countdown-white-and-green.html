<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Year 2026 Countdown</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Quicksand:wght@300..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
        :root {
            /* --bg-color-start: #0f0c29;
            --bg-color-mid: #302b63;
            --bg-color-end: #24243e; */
            /* Fallback solid color */
            /* --text-gold: #f2c94c;  */
            /* Gradient for text */
            /* --text-gradient: linear-gradient(to bottom, #fef9d7 0%, #d2994a 100%); */
            --bg-color-start: #ffffff;
            --bg-color-mid: #ffffff;
            --bg-color-end: #ffffff;
            --text-gold: #1da750;
            --text-green: #1da750;
            /* --text-gradient: linear-gradient(to bottom, #fef9d7 0%, #d2994a 100%); */
            /* --text-gradient:linear-gradient(90deg,rgba(42, 123, 155, 1) 0%, rgba(87, 199, 133, 1) 70%, rgba(237, 221, 83, 1) 100%); */
            --text-gradient:#1da750;
        }

        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            /* font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; */
            font-family: Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            background-color: var(--bg-color-start);
        }
        *{
            margin: 0;
            padding: 0;
        }

        /* Main full-screen background with gradient */
        .main-wrapper {
            min-height: 100vh;
            background: var(--bg-color-start); /* fallback for old browsers */
            background: -webkit-linear-gradient(to right, var(--bg-color-start), var(--bg-color-mid), var(--bg-color-end));
            background: linear-gradient(to right, var(--bg-color-start), var(--bg-color-mid), var(--bg-color-end));
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative; /* For confetti canvas positioning */
        }

        /* Heading Information */
        .heading-info {
            text-transform: uppercase;
            letter-spacing: 5px;
            font-weight: 300;
            color: var(--text-gold);
            margin-bottom: 2rem;
            text-shadow: 0 0 10px rgba(242, 201, 76, 0.5);
        }

        /* The Container for the Timer Numbers */
        #timer-container {
            display: flex;
            justify-content: center;
            /* align-items: center; */
            flex-wrap: wrap; /* Wrap on very small devices if necessary */
            gap: 2vw; /* Responsive gap between units */
        }

        /* The individual time units (Day, Hour, etc.) wrapper */
        .time-unit-wrapper {
            text-align: center;
        }

        /* THE MASSIVE NUMBERS */
        .giant-number {
            font-weight: 900;
            /* The core requirement: Size is ~20% of viewport width. 
               Using clamp to set a minimum and maximum reasonable size. */
            /* font-size: clamp(80px, 18vw, 250px);  */
            font-size: clamp(80px, 18vw, 120px); 
            line-height: 1;
            display: block;
            
            /* Gold Gradient Text Effect */
            background: var(--text-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            /* Subtle shadow for depth */
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.5));
        }

        /* Labels (Days, Hours, etc.) */
        .unit-label {
            font-size: clamp(1rem, 2vw, 2rem);
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.8);
            margin-top: 10px;
        }

        /* SVG Decorative Side Panels styling */
        .side-svg-container {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.6;
            /* Ensure they don't overlap content on smaller screens before they disappear */
            z-index: 0; 
        }

        .deco-svg {
            width: 80%;
            height: auto;
            fill: var(--text-gold);
            filter: drop-shadow(0 0 10px var(--text-gold));
            animation: pulse 3s infinite ease-in-out;
        }

        /* Subtle animation for SVGs */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 0.6; }
        }

        /* Finished Message styling */
        #finished-message {
            display: none; /* Hidden initially */
            font-size: clamp(60px, 10vw, 150px);
            font-weight: 900;
            background: var(--text-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            /* Ensure message is above confetti */
            position: relative; 
            z-index: 1001;
            animation: popIn 1s ease-out forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Canvas for confetti needs to sit on top */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through */
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div class="container-fluid main-wrapper">
        <canvas id="confetti-canvas"></canvas>

        <div class="row h-100 align-items-center position-relative text-center">
            
            <div class="col-md-2 d-none d-md-flex side-svg-container">
                <svg class="deco-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z" />
                    <circle cx="4" cy="4" r="2"/>
                    <circle cx="20" cy="20" r="2"/>
                    <circle cx="20" cy="4" r="1"/>
                    <circle cx="4" cy="20" r="1"/>
                </svg>
            </div>

            <div class="col-md-8 col-12 z-2">
                <h2 class="heading-info display-6" id="sub-heading">Countdown to</h2>
                <h1 class="heading-info display-1 fw-bold mb-5">New Year 2026</h1>

                <div id="timer-container">
                    <div class="time-unit-wrapper">
                        <span id="days" class="giant-number">00</span>
                        <div class="unit-label">Days</div>
                    </div>
                    <div class="time-unit-wrapper">
                        <span class="giant-number">:</span>
                    </div>
                     <div class="time-unit-wrapper">
                        <span id="hours" class="giant-number">00</span>
                        <div class="unit-label">Hours</div>
                    </div>
                    <div class="time-unit-wrapper">
                        <span class="giant-number">:</span>
                    </div>
                     <div class="time-unit-wrapper">
                        <span id="minutes" class="giant-number">00</span>
                        <div class="unit-label">Mins</div>
                    </div>
                    <div class="time-unit-wrapper">
                        <span class="giant-number">:</span>
                    </div>
                     <div class="time-unit-wrapper">
                        <span id="seconds" class="giant-number">00</span>
                        <div class="unit-label">Secs</div>
                    </div>
                </div>

                <div id="finished-message">
                    HAPPY NEW YEAR<br>2026!
                </div>

            </div>

            <div class="col-md-2 d-none d-md-flex side-svg-container">
                 <svg class="deco-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="transform: scaleX(-1);">
                    <path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z" />
                    <circle cx="4" cy="4" r="2"/>
                    <circle cx="20" cy="20" r="2"/>
                    <circle cx="20" cy="4" r="1"/>
                    <circle cx="4" cy="20" r="1"/>
                </svg>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        // --- Configuration ---
        // TOTAL DURATION OF CELEBRATION (in milliseconds)
        const CELEBRATION_DURATION = 30 * 1000; // 30 Seconds

        // Set the date we're counting down to
        const targetDateStr = "Jan 1, 2026 00:00:00";
        
        // *** FOR TESTING ONLY: Uncomment next line to finish in 5 seconds ***
        // const targetDateStr = new Date(new Date().getTime() + 5000); 

        const countDownDate = new Date(targetDateStr).getTime();
        let celebrationTriggered = false;

        // Get DOM elements
        const daysEl = document.getElementById("days");
        const hoursEl = document.getElementById("hours");
        const minutesEl = document.getElementById("minutes");
        const secondsEl = document.getElementById("seconds");
        const timerContainer = document.getElementById("timer-container");
        const finishedMessage = document.getElementById("finished-message");
        const subHeading = document.getElementById("sub-heading");
        const myConfettiCanvas = document.getElementById('confetti-canvas');

        // Initialize confetti on our specific canvas
        var myConfetti = confetti.create(myConfettiCanvas, {
            resize: true,
            useWorker: true
        });

        // Helper function to add leading zero
        function formatTime(time) {
            return time < 10 ? `0${time}` : time;
        }

        // Helper for random range
        function randomInRange(min, max) {
            return Math.random() * (max - min) + min;
        }

        // --- The Main Interval Function ---
        const countdownInterval = setInterval(function() {

            const now = new Date().getTime();
            const distance = countDownDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            daysEl.innerText = formatTime(days);
            hoursEl.innerText = formatTime(hours);
            minutesEl.innerText = formatTime(minutes);
            secondsEl.innerText = formatTime(seconds);
            secondsEl.style.transform = (seconds % 2 === 0) ? "scale(1.02)" : "scale(1)";
            secondsEl.style.transition = "transform 0.1s ease";


            // --- If the countdown is finished ---
            if (distance < 0) {
                clearInterval(countdownInterval);
                
                // Hide timer, show message
                timerContainer.style.display = "none";
                finishedMessage.style.display = "block";
                subHeading.innerText = "Welcome to";

                // Trigger celebration only once
                if (!celebrationTriggered) {
                    // Launch the side streams
                    triggerSideCannons();
                    // Launch the fireworks bursts
                    triggerFireworks();
                    celebrationTriggered = true;
                }
            }
        }, 1000); // Update every 1 second

        // --- Celebration Animation 1: Side Cannons ---
        // Streams of confetti from left and right edges
        function triggerSideCannons() {
            var animationEnd = Date.now() + CELEBRATION_DURATION;
            var defaults = { startVelocity: 30, spread: 360, ticks: 200, zIndex: 1000 };

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 50 * (timeLeft / CELEBRATION_DURATION);
                
                // Fire confetti from two sides
                myConfetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.0, 0.2), y: Math.random() - 0.2 },
                    colors: ['#FFD700', '#ffffff'] // Gold and white for sides
                }));
                myConfetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.8, 1.0), y: Math.random() - 0.2 },
                    colors: ['#FFD700', '#ffffff']
                }));
            }, 250);
        }

        // --- Celebration Animation 2: Fireworks ---
        // Bursts firing from the bottom up
        function triggerFireworks() {
             var animationEnd = Date.now() + CELEBRATION_DURATION;
             // Festive colors
             var colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#00ffff', '#ff00ff', '#ffd700', '#ffffff'];

             var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                // Launch a firework burst randomly every 400ms-800ms
                 myConfetti({
                     particleCount: randomInRange(100, 200), // denser bursts
                     angle: randomInRange(80, 100), // shoot mostly straight up
                     spread: randomInRange(50, 150), // wide burst
                     startVelocity: randomInRange(50, 90), // fast launch
                     decay: 0.9, // fall down slower
                     gravity: 1.2,
                     origin: { 
                         x: randomInRange(0.1, 0.9), // random spot horizontally
                         y: Math.random() * 0.1 + 0.9 // start near the bottom edge
                     },
                     colors: colors,
                     zIndex: 1005 // ensure fireworks are on top of side cannons
                 });

             }, randomInRange(400, 800));
        }
    </script>
</body>
</html>
